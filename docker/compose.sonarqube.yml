services:
  sonarqube-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONAR_POSTGRES_DB:?Define SONAR_POSTGRES_DB en .env}
      POSTGRES_USER: ${SONAR_POSTGRES_USER:?Define SONAR_POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${SONAR_POSTGRES_PASSWORD:?Define SONAR_POSTGRES_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - sonarqube_postgres_data:/var/lib/postgresql/data
    networks:
      - sonarqube_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_POSTGRES_DB:?Define SONAR_POSTGRES_DB en .env}
      SONAR_JDBC_USERNAME: ${SONAR_POSTGRES_USER:?Define SONAR_POSTGRES_USER en .env}
      SONAR_JDBC_PASSWORD: ${SONAR_POSTGRES_PASSWORD:?Define SONAR_POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarqube_backend
      - sonarqube_frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

volumes:
  sonarqube_postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  sonarqube_backend:
    driver: bridge
    internal: true
  sonarqube_frontend:
    driver: bridge
