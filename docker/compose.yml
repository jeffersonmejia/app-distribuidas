services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ERP_POSTGRES_DB:?Define ERP_POSTGRES_DB en .env}
      POSTGRES_USER: ${ERP_POSTGRES_USER:?Define ERP_POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${ERP_POSTGRES_PASSWORD:?Define ERP_POSTGRES_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: ["postgres", "-c", "statement_timeout=30s"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  erp_postgres_data:

networks:
  erp_network:
    driver: bridge
