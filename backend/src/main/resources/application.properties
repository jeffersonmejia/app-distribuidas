# La documentación queda apagada salvo que se active el perfil local dev.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=${VITE_PRODUCT_NAME:Nexo ERP}
spring.datasource.url=${DB_RUNTIME_URL:jdbc:postgresql://localhost:5432/erp}
spring.datasource.username=${DB_RUNTIME_USER:erp_runtime}
spring.datasource.password=${DB_RUNTIME_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.url=${DB_MIGRATION_URL:jdbc:postgresql://localhost:5432/erp}
spring.flyway.user=${DB_MIGRATION_USER:erp_migrator}
spring.flyway.password=${DB_MIGRATION_PASSWORD:}
