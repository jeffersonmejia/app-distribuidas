# La documentación queda apagada salvo que se active el perfil local dev.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=${VITE_PRODUCT_NAME:Nexo ERP}
spring.datasource.url=${DB_RUNTIME_URL:jdbc:postgresql://localhost:5432/erp}
spring.datasource.username=${DB_RUNTIME_USER:erp_runtime}
spring.datasource.password=${DB_RUNTIME_PASSWORD:}
# Evita que los errores del servidor incluyan valores de filas en los logs del cliente JDBC.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.url=${DB_MIGRATION_URL:jdbc:postgresql://localhost:5432/erp}
spring.flyway.user=${DB_MIGRATION_USER:erp_migrator}
spring.flyway.password=${DB_MIGRATION_PASSWORD:}
# Marketing: Gmail SMTP. La cuenta y su contraseña de aplicación llegan solo como secretos del entorno.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MARKETING_SMTP_USER:}
spring.mail.password=${MARKETING_SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Límite de pruebas aprobado en MKT-002: destinatarios por día y tenant.
marketing.mail.daily-limit=20
