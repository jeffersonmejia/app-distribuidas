name: Quality Gate

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-coverage:
    name: Tests and 80% changed-code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend tests and create JaCoCo report
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml test org.jacoco:jacoco-maven-plugin:0.8.16:report

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend build and tests with LCOV coverage
        working-directory: frontend
        run: |
          npm run build
          npm run test:coverage

      - name: Enforce 80% coverage on changed source lines
        run: |
          python -m pip install --disable-pip-version-check diff-cover==10.6.0
          diff-cover \
            backend/target/site/jacoco/jacoco.xml \
            frontend/coverage/lcov.info \
            --compare-branch=origin/develop \
            --src-roots backend/src/main/java frontend \
            --fail-under=80

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build backend for CodeQL
        if: matrix.language == 'java-kotlin'
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml -DskipTests compile

      - name: Build frontend for CodeQL
        if: matrix.language == 'javascript-typescript'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
