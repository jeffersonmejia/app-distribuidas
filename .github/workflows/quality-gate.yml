name: Quality Gate

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-coverage:
    name: Tests and 80% changed-code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select changed-code comparison base
        id: coverage-base
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/$PR_BASE_REF"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base_ref="$BEFORE_SHA"
          else
            base_ref="$(git rev-parse HEAD^)"
          fi
          if ! git rev-parse --verify "$base_ref^{commit}" >/dev/null 2>&1; then
            echo "No se encontró el commit base de cobertura: $base_ref" >&2
            exit 1
          fi
          echo "ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Run backend tests and create JaCoCo report
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml test org.jacoco:jacoco-maven-plugin:0.8.16:report

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend build and tests with LCOV coverage
        working-directory: frontend
        run: |
          npm run build
          npm run test:coverage

      - name: Enforce 80% coverage on changed source lines
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check diff-cover==10.6.0
          base_ref='${{ steps.coverage-base.outputs.ref }}'
          changed_java=false
          changed_frontend=false
          if git diff --name-only "$base_ref...HEAD" -- backend/src/main/java | grep -Eq '\.java$'; then
            changed_java=true
          fi
          if git diff --name-only "$base_ref...HEAD" -- frontend/src | grep -Eq '\.(js|jsx|ts|tsx)$'; then
            changed_frontend=true
          fi
          if [[ -f backend/target/site/jacoco/jacoco.xml ]]; then
            if [[ "$changed_java" == "true" ]]; then
              diff-cover backend/target/site/jacoco/jacoco.xml \
                --compare-branch="$base_ref" \
                --src-roots backend/src/main/java \
                --fail-under=80
            fi
          elif [[ "$changed_java" == "true" ]]; then
            echo 'JaCoCo no produjo el informe requerido para cambios Java.' >&2
            exit 1
          fi
          if [[ "$changed_frontend" == "true" ]]; then
            diff-cover frontend/coverage/lcov.info \
              --compare-branch="$base_ref" \
              --src-roots frontend \
              --fail-under=80
          fi

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Java source files
        if: matrix.language == 'java-kotlin'
        id: java-source
        shell: bash
        run: |
          if find backend/src/main/java -type f -name '*.java' -print -quit | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: matrix.language == 'java-kotlin' && steps.java-source.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Initialize CodeQL
        if: matrix.language != 'java-kotlin' || steps.java-source.outputs.present == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build backend for CodeQL
        if: matrix.language == 'java-kotlin' && steps.java-source.outputs.present == 'true'
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml -DskipTests compile

      - name: Build frontend for CodeQL
        if: matrix.language == 'javascript-typescript'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Analyze with CodeQL
        if: matrix.language != 'java-kotlin' || steps.java-source.outputs.present == 'true'
        uses: github/codeql-action/analyze@v4
