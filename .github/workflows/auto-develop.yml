name: Automatic integration to develop

on:
  pull_request_target:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
  check_run:
    types:
      - completed
  push:
    branches:
      - develop
      - Bruce
      - Esteban
      - Sahid
      - Dayanara
      - Jennifer
      - Jefferson
  schedule:
    - cron: '3/5 * * * *'

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write
  statuses: read

jobs:
  open-personal-branch-pr:
    name: Open pull request from personal branch
    if: (github.event_name == 'push' && github.ref_name != 'develop') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_DEVELOP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_DEVELOP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: app-distribuidas
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
      - name: Open pull request for the matching contributor
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const contributors = {
              Bruce: 'BruceRodri',
              Esteban: 'EMLarco',
              Sahid: 'Sahid-B',
              Dayanara: 'Dayanarablb',
              Jennifer: 'Jntorres2001',
              Jefferson: 'jeffersonmejia',
            };
            const branches = context.eventName === 'push'
              ? [context.ref.replace('refs/heads/', '')]
              : Object.keys(contributors);

            for (const branch of branches) {
              const responsible = contributors[branch];
              if (!responsible) continue;

              if (context.eventName === 'push') {
                const pusher = context.payload.sender.login;
                if (pusher.toLowerCase() !== responsible.toLowerCase()) {
                  core.info(`Omito abrir un PR desde @${pusher}: la rama ${branch} pertenece a @${responsible}. Los PR existentes siguen su curso.`);
                  continue;
                }
              }

              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: 'develop',
                head: branch,
              });
              if (context.eventName === 'schedule') {
                const latestCommitAuthor = comparison.data.commits.at(-1)?.author?.login;
                if (comparison.data.ahead_by === 0 ||
                    latestCommitAuthor?.toLowerCase() !== responsible.toLowerCase()) {
                  continue;
                }
              }

              if ((comparison.data.files ?? []).length === 0) {
                core.info(`La rama ${branch} no tiene cambios de archivos frente a develop; no se abrirá un PR.`);
                continue;
              }

              const existing = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: 'develop',
                head: `${context.repo.owner}:${branch}`,
                per_page: 1,
              });
              if (existing.data.length > 0) {
                core.info(`El PR #${existing.data[0].number} ya existe; sus checks y auto-merge continuarán.`);
                continue;
              }

              const pullRequest = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                base: 'develop',
                title: `chore: integra ${branch} en develop`,
                body: `chore: integra ${branch} en develop\n\n@${responsible} Se subieron cambios desde la rama ${branch} y se solicita integrarlos en develop. La integración será automática cuando pasen los checks requeridos y no haya conflictos. Si algún check falla o hay conflictos, el responsable deberá corregirlos y actualizar el PR.`,
                maintainer_can_modify: true,
              });
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.data.number,
                assignees: [responsible],
              });
              core.info(`PR #${pullRequest.data.number} creado para @${responsible}.`);
            }

  integrate:
    name: Queue eligible pull request
    if: (github.event_name != 'push' || github.ref_name == 'develop') && (github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_DEVELOP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_DEVELOP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: app-distribuidas
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: read
          permission-workflows: write
      - name: Enable automatic merge or report blockers
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const marker = '<!-- develop-auto-integration -->';
            const contributors = {
              Bruce: 'BruceRodri',
              Esteban: 'EMLarco',
              Sahid: 'Sahid-B',
              Dayanara: 'Dayanarablb',
              Jennifer: 'Jntorres2001',
              Jefferson: 'jeffersonmejia',
            };
            const requiredChecks = new Set([
              'Validar commits',
              'Tests and 80% changed-code coverage',
              'CodeQL (java-kotlin)',
              'CodeQL (javascript-typescript)',
              'CodeQL',
            ]);

            let pullRequests = [];
            if (context.eventName === 'pull_request_target') {
              pullRequests = [context.payload.pull_request];
            } else if (context.eventName === 'check_run') {
              const sha = context.payload.check_run.head_sha;
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              });
              pullRequests = associated.data.filter((pr) =>
                pr.base.ref === 'develop' && pr.state === 'open' && pr.head.sha === sha
              );
            } else {
              const open = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: 'develop',
                per_page: 100,
              });
              pullRequests = open.data;
            }

            for (const candidate of pullRequests) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: candidate.number,
              });
              const pr = response.data;
              if (pr.base.ref !== 'develop') continue;
              const responsible = contributors[pr.head.ref] || pr.user.login;

              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const automationComment = comments.data.find((comment) => comment.body?.includes(marker));

              if (context.eventName === 'pull_request_target' && context.payload.action === 'closed') {
                if (automationComment && pr.merged) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: automationComment.id,
                    body: `${marker}\n@${responsible} Los cambios de la rama ${pr.head.ref} se integraron automáticamente en develop.`,
                  });
                }
                continue;
              }

              if (pr.state !== 'open') continue;

              if (pr.draft) continue;

              if (pr.mergeable_state === 'behind') {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  expected_head_sha: pr.head.sha,
                });
                const body = `${marker}\n@${responsible} La rama ${pr.head.ref} estaba atrasada respecto a develop. Se solicitó su actualización automática; GitHub volverá a ejecutar los checks con la rama actualizada antes de integrarla.`;
                if (automationComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: automationComment.id,
                    body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body,
                  });
                }
                core.info(`Solicitada la actualización automática de la rama del PR #${pr.number}; se esperarán los checks del nuevo commit.`);
                continue;
              }

              const checkRuns = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const latestRequiredChecks = new Map();
              for (const check of checkRuns.data.check_runs) {
                if (!requiredChecks.has(check.name)) continue;
                const previous = latestRequiredChecks.get(check.name);
                if (!previous || Date.parse(check.started_at || check.created_at) >
                  Date.parse(previous.started_at || previous.created_at)) {
                  latestRequiredChecks.set(check.name, check);
                }
              }
              const failedChecks = [...latestRequiredChecks.values()]
                .filter((check) => ['failure', 'cancelled', 'timed_out', 'action_required'].includes(check.conclusion))
                .map((check) => check.name);
              const statuses = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });
              const failedStatuses = statuses.data.statuses
                .filter((status) => requiredChecks.has(status.context) && ['failure', 'error'].includes(status.state))
                .map((status) => status.context);
              const blockers = [...new Set([...failedChecks, ...failedStatuses])];

              if (pr.mergeable_state === 'dirty') {
                blockers.push('conflictos con develop');
              }

              if (blockers.length > 0) {
                const body = `${marker}\n@${responsible} No se pudo integrar el cambio: fallaron ${[...new Set(blockers)].map((name) => `\`${name}\``).join(', ')}. El responsable debe corregir los problemas y actualizar el PR; la integración se reintentará automáticamente.`;
                if (automationComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: automationComment.id,
                    body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body,
                  });
                }
                continue;
              }

              const nodeId = pr.node_id;
              const mergeMethod = 'SQUASH';

              const mergedBranchPullRequests = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                base: 'develop',
                head: `${context.repo.owner}:${pr.head.ref}`,
                per_page: 100,
              });
              const previousMergedPullRequest = mergedBranchPullRequests
                .filter((previous) => previous.number !== pr.number && previous.merged_at)
                .sort((left, right) => Date.parse(right.merged_at) - Date.parse(left.merged_at))[0];
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });

              let contributionCommits = commits;
              if (previousMergedPullRequest) {
                const previousHeadIndex = commits.findIndex((commit) =>
                  commit.sha === previousMergedPullRequest.head.sha
                );
                if (previousHeadIndex < 0) {
                  core.warning(`No se pudo acotar la autoría del PR #${pr.number} al trabajo posterior al PR #${previousMergedPullRequest.number}; no se añadirán coautores para evitar atribuir cambios antiguos.`);
                  contributionCommits = [];
                } else {
                  contributionCommits = commits.slice(previousHeadIndex + 1);
                }
              }

              const coauthors = new Map();
              for (const commit of contributionCommits) {
                if (commit.parents.length > 1) continue;

                const author = commit.author;
                if (author?.login && author.type !== 'Bot' && !author.login.endsWith('[bot]') && author.id) {
                  const name = (commit.commit.author?.name || author.login).replace(/[\r\n<>]/g, ' ').trim();
                  const email = `${author.id}+${author.login}@users.noreply.github.com`;
                  coauthors.set(email.toLowerCase(), `Co-authored-by: ${name} <${email}>`);
                }

                const existingCoauthors = commit.commit.message.matchAll(/^Co-authored-by:\s*(.+?)\s*<([^<>]+)>\s*$/gim);
                for (const [, name, email] of existingCoauthors) {
                  coauthors.set(email.toLowerCase(), `Co-authored-by: ${name.trim()} <${email.trim()}>`);
                }
              }

              const commitBody = [...coauthors.values()].join('\n');
              if (commitBody) {
                core.info(`El commit squash del PR #${pr.number} acreditará ${coauthors.size} coautor(es) del trabajo nuevo.`);
              }

              await github.graphql(
                `mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!, $commitBody: String) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: $mergeMethod,
                    commitBody: $commitBody
                  }) {
                    pullRequest { id }
                  }
                }`,
                { pullRequestId: nodeId, mergeMethod, commitBody: commitBody || null },
              );

              if (automationComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: automationComment.id,
                  body: `${marker}\n@${responsible} Se corrigieron los bloqueos del PR. El PR quedó en cola para integrarse automáticamente cuando pasen todos los checks requeridos y no haya conflictos.`,
                });
              }
            }

  open-main-review-pr:
    name: Open manual review pull request to main
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_DEVELOP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_DEVELOP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: app-distribuidas
          permission-contents: read
          permission-pull-requests: write
      - name: Open pull request for manual review
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const open = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              head: `${context.repo.owner}:develop`,
              per_page: 1,
            });

            if (open.data.length > 0) {
              core.info(`El PR #${open.data[0].number} ya reúne los cambios de develop para revisión manual.`);
              return;
            }

            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: 'develop',
            });
            if (comparison.data.ahead_by === 0 || comparison.data.files?.length === 0) {
              core.info('No hay cambios de archivos para promover de develop a main; no se abrirá un PR vacío.');
              return;
            }

            const pullRequest = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'develop',
              base: 'main',
              title: 'chore: promueve cambios de develop a main',
              body: 'chore: promueve cambios de develop a main\n\nSe promueven a main los cambios integrados en develop. Se solicita una revisión manual antes de completar la promoción; este PR no se fusiona automáticamente.',
              maintainer_can_modify: true,
            });
            core.info(`PR #${pullRequest.data.number} abierto para revisión manual; no se activará auto-merge.`);

  open-develop-reconciliation-pr:
    name: Open automatic history sync pull request to develop
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_DEVELOP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_DEVELOP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: app-distribuidas
          permission-contents: read
          permission-pull-requests: write
      - name: Open synchronization pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const open = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'develop',
              head: `${context.repo.owner}:main`,
              per_page: 1,
            });

            if (open.data.length > 0) {
              core.info(`El PR #${open.data[0].number} ya sincroniza main con develop.`);
              return;
            }

            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'develop',
              head: 'main',
            });
            if (comparison.data.ahead_by === 0 || comparison.data.files?.length === 0) {
              core.info('main no tiene cambios de archivos o commits que sincronizar en develop.');
              return;
            }

            const pullRequest = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'main',
              base: 'develop',
              title: 'chore: sincroniza develop con main',
              body: 'chore: sincroniza develop con main\n\nSe sincroniza el historial de main en develop después de una promoción aprobada. El PR se integrará automáticamente cuando pasen los checks requeridos y no existan conflictos.',
              maintainer_can_modify: true,
            });
            core.info(`PR #${pullRequest.data.number} abierto para sincronizar main con develop; los checks decidirán su integración automática.`);
