name: Automatic integration to develop

on:
  pull_request_target:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
  check_run:
    types:
      - completed
  push:
    branches:
      - develop
      - Bruce
      - Esteban
      - Sahid
      - Dayanara
      - Jennifer
      - Jefferson
  schedule:
    - cron: '3/5 * * * *'

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write
  statuses: read

jobs:
  open-personal-branch-pr:
    name: Open pull request from personal branch
    if: (github.event_name == 'push' && github.ref_name != 'develop') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_DEVELOP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_DEVELOP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: app-distribuidas
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
      - name: Open pull request for the matching contributor
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const contributors = {
              Bruce: 'BruceRodri',
              Esteban: 'EMLarco',
              Sahid: 'Sahid-B',
              Dayanara: 'Dayanarablb',
              Jennifer: 'Jntorres2001',
              Jefferson: 'jeffersonmejia',
            };
            const branches = context.eventName === 'push'
              ? [context.ref.replace('refs/heads/', '')]
              : Object.keys(contributors);

            for (const branch of branches) {
              const responsible = contributors[branch];
              if (!responsible) continue;

              if (context.eventName === 'push') {
                const pusher = context.payload.sender.login;
                if (pusher.toLowerCase() !== responsible.toLowerCase()) {
                  core.setFailed(`@${pusher}: mi push no se procesó porque la rama ${branch} corresponde a @${responsible}.`);
                  continue;
                }
              } else {
                const comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: 'develop',
                  head: branch,
                });
                const latestCommitAuthor = comparison.data.commits.at(-1)?.author?.login;
                if (comparison.data.ahead_by === 0 ||
                    latestCommitAuthor?.toLowerCase() !== responsible.toLowerCase()) {
                  continue;
                }
              }

              const existing = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: 'develop',
                head: `${context.repo.owner}:${branch}`,
                per_page: 1,
              });
              if (existing.data.length > 0) {
                core.info(`El PR #${existing.data[0].number} ya existe; sus checks y auto-merge continuarán.`);
                continue;
              }

              const pullRequest = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                base: 'develop',
                title: `Integrar ${branch} en develop`,
                body: `@${responsible} Subí mi cambio desde mi rama y solicito integrarlo en develop. Se integrará automáticamente cuando pasen los checks requeridos y no haya conflictos. Si algo falla, corregiré el problema y actualizaré el PR.`,
                maintainer_can_modify: true,
              });
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.data.number,
                assignees: [responsible],
              });
              core.info(`PR #${pullRequest.data.number} creado para @${responsible}.`);
            }

  integrate:
    name: Queue eligible pull request
    if: github.event_name != 'push' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_DEVELOP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_DEVELOP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: app-distribuidas
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: read
      - name: Enable automatic merge or report blockers
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const marker = '<!-- develop-auto-integration -->';
            const contributors = {
              Bruce: 'BruceRodri',
              Esteban: 'EMLarco',
              Sahid: 'Sahid-B',
              Dayanara: 'Dayanarablb',
              Jennifer: 'Jntorres2001',
              Jefferson: 'jeffersonmejia',
            };
            const requiredChecks = new Set([
              'Validar commits',
              'Tests and 80% changed-code coverage',
              'CodeQL (java-kotlin)',
              'CodeQL (javascript-typescript)',
              'CodeQL',
            ]);

            let pullRequests = [];
            if (context.eventName === 'pull_request_target') {
              pullRequests = [context.payload.pull_request];
            } else if (context.eventName === 'check_run') {
              const sha = context.payload.check_run.head_sha;
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              });
              pullRequests = associated.data.filter((pr) =>
                pr.base.ref === 'develop' && pr.state === 'open' && pr.head.sha === sha
              );
            } else {
              const open = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: 'develop',
                per_page: 100,
              });
              pullRequests = open.data;
            }

            for (const candidate of pullRequests) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: candidate.number,
              });
              const pr = response.data;
              if (pr.base.ref !== 'develop') continue;
              const responsible = contributors[pr.head.ref] || pr.user.login;

              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const automationComment = comments.data.find((comment) => comment.body?.includes(marker));

              if (context.eventName === 'pull_request_target' && context.payload.action === 'closed') {
                if (automationComment && pr.merged) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: automationComment.id,
                    body: `${marker}\n@${responsible} Mi cambio se integró automáticamente en develop.`,
                  });
                }
                continue;
              }

              if (pr.state !== 'open') continue;

              if (pr.draft) continue;

              const checkRuns = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const latestRequiredChecks = new Map();
              for (const check of checkRuns.data.check_runs) {
                if (!requiredChecks.has(check.name)) continue;
                const previous = latestRequiredChecks.get(check.name);
                if (!previous || Date.parse(check.started_at || check.created_at) >
                  Date.parse(previous.started_at || previous.created_at)) {
                  latestRequiredChecks.set(check.name, check);
                }
              }
              const failedChecks = [...latestRequiredChecks.values()]
                .filter((check) => ['failure', 'cancelled', 'timed_out', 'action_required'].includes(check.conclusion))
                .map((check) => check.name);
              const statuses = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });
              const failedStatuses = statuses.data.statuses
                .filter((status) => requiredChecks.has(status.context) && ['failure', 'error'].includes(status.state))
                .map((status) => status.context);
              const blockers = [...new Set([...failedChecks, ...failedStatuses])];

              if (pr.mergeable_state === 'dirty') {
                blockers.push('conflictos con develop');
              }

              if (blockers.length > 0) {
                const body = `${marker}\n@${responsible} No pude integrar mi cambio: fallaron ${[...new Set(blockers)].map((name) => `\`${name}\``).join(', ')}. Voy a corregir el problema y actualizar el PR; la integración se reintentará automáticamente.`;
                if (automationComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: automationComment.id,
                    body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body,
                  });
                }
                continue;
              }

              const nodeId = pr.node_id;
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { id }
                  }
                }`,
                { pullRequestId: nodeId },
              );

              if (automationComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: automationComment.id,
                  body: `${marker}\n@${responsible} Ya corregí los bloqueos de mi PR. GitHub lo dejó en cola para integrarse automáticamente cuando pasen todos los checks requeridos y no haya conflictos.`,
                });
              }
            }
