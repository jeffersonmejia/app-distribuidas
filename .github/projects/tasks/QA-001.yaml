issue:
  title: '[QA-001] Definir estrategia inicial de pruebas'
  body: '<!-- managed-task-id: QA-001 -->


    ## Descripción

    Definir y documentar la estrategia inicial de pruebas unitarias, de integración y de rendimiento con k6. Jefferson (jeffersonmejia) es responsable de la definición. Jennifer (Jntorres2001) ejecutará las pruebas cuando existan funcionalidades y criterios definidos. Esta tarea no implementa pruebas ni código durante el scaffolding inicial.


    ## Criterios de aceptación

    - La estrategia está documentada en `docs/testing.md`.

    - Incluye pruebas unitarias, de integración y de rendimiento con k6.

    - Define como flujos críticos POS/registro de venta, consulta de inventario y búsqueda/listado de clientes CRM.

    - Define el perfil inicial de 1 a 10 VUs y 5 minutos a carga estable.

    - Define umbrales: errores HTTP <1%, p95 de lecturas <500 ms y p95 de escrituras <1 s.

    - Separa la verificación de aislamiento tenant de los umbrales de rendimiento.

    - No crea scripts k6 ni pruebas de aplicación durante el scaffolding inicial.


    ## Gestión

    - Área: Calidad y testing

    - Prioridad: Alta

    - Estado: Completado

    - Responsable de definición: @jeffersonmejia

    - Responsable de ejecución: @Jntorres2001

    - Rama: Jefferson

    - Rutas: docs/testing.md

    - Dependencias: Funcionalidades implementadas por feature'
