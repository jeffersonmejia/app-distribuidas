    Ejecutar pruebas k6 de venta POS, disponibilidad de inventario y búsqueda de clientes en entorno de pruebas.


    ## Criterios de aceptación

    - [ ] Usar ramp-up 1→10 VUs y 10 VUs durante 5 minutos; nunca producción.

    - [ ] Errores HTTP <1%, lecturas p95 <500 ms y escrituras p95 <1 s.

