  title: '[TEN-001] Implementar tenants, membresías y contexto por solicitud'
  body: "<!-- managed-task-id: TEN-001 -->\n\n**Feature:** Multitenancy  \n**Responsable:** @jeffersonmejia  \n**Rutas:** backend/src/main/java/com/erp/features/tenancy/, backend/src/main/resources/db/migration/, backend/src/test/java/com/erp/features/tenancy/, docs/multitenancy.md  \n**Dependencias:** AUTH-002  \n**Fecha objetivo:** 2026-11-17\n\n## Alcance\nImplementar ciclo tenant/membresía y contexto tenant/actor validado, con persistencia Code First y migraciones compatibles.\n\n## Criterios de aceptación\n- [ ] Validar membresía activa y permisos antes del acceso a datos.\n- [ ] Propagar contexto explícito sin reutilizarlo entre solicitudes.\n- [ ] Tablas tenant-scoped usan tenant_id NOT NULL y constraints tenant-scoped.\n- [ ] RLS falla cerrada y runtime no es propietario privilegiado ni BYPASSRLS.\n- [ ] Probar acceso cruzado, falta de contexto, rollback y limpieza del contexto.\n\n## Bloqueo actual\nBloqueada por: AUTH-002 (@EMLarco)."
