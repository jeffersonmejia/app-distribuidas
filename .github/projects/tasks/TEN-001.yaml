  body: "<!-- managed-task-id: TEN-001 -->\n\n**Feature:** Multitenancy  \n**Responsable:** @jeffersonmejia  \n**Rutas:** backend/src/main/java/com/erp/features/tenancy/, backend/src/main/resources/db/migration/, backend/src/test/java/com/erp/features/tenancy/, docs/multitenancy.md, docs/tenancy-operacion.md  \n**Dependencias:** AUTH-002  \n**Fecha objetivo:** 2026-11-17\n\n## Alcance\nImplementar ciclo tenant/membresía y contexto tenant/actor validado con persistencia Code First, RLS y migraciones. El tenant inicial y su primera membresía se provisionan operacionalmente; no hay alta pública.\n\n## Criterios de aceptación\n- [x] Validar membresía activa y permisos antes del acceso a datos.\n- [x] Propagar contexto explícito sin reutilizarlo entre solicitudes.\n- [x] Tablas tenant-scoped usan tenant_id NOT NULL y constraints tenant-scoped; tenant es una excepción global documentada.\n- [x] RLS falla cerrada; runtime no es superusuario, propietario de tablas ni BYPASSRLS.\n- [x] Pruebas PostgreSQL\
