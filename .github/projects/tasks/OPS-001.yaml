  body: '<!-- managed-task-id: OPS-001 -->


    ## Descripción

    Definir archivos Compose locales para PostgreSQL del ERP y SonarQube con su propia base PostgreSQL, healthchecks, redes y variables de entorno de ejemplo.


    ## Criterios de aceptación

    - PostgreSQL del ERP se configura con persistencia y healthcheck.

    - SonarQube utiliza una base separada y redes aisladas.

    - Las credenciales se documentan como variables locales y no se almacenan como secretos reales.


