  body: "<!-- managed-task-id: ACC-002 -->
**Feature:** Contabilidad **Responsable:** @BruceRodri **Rutas:** backend/src/main/java/com/erp/features/accounting/, backend/src/main/resources/db/migration/, backend/src/test/java/com/erp/features/accounting/ **Dependencias:** ACC-001, TEN-001, POS-002 **Fecha objetivo:** 2026-11-20
## Alcance Registrar los asientos de venta según las reglas aprobadas en `docs/tasks/ACC-002.md`.
## Criterios de aceptación - [ ] Usar USD y dos decimales; mostrar miles con coma y decimales con punto. - [ ] Usar Caja/Bancos, Ventas e Impuestos por pagar sin códigos contables. - [ ] Debitar el total cobrado, acreditar ventas netas e impuesto por línea recibido de POS. - [ ] Una venta genera un asiento por `(tenant_id, sale_id)`; devoluciones/cancelaciones generan reverso sin borrar el original. - [ ] Operaciones tenant-scoped son idempotentes y transaccionales; migraciones y verificaciones cubren rollback y aislamiento.
## Estado Sin bloqueos: POS-002 completada por Bruce. ACC-002 queda lista para ejecución; las decisiones contables están aprobadas.
## Especificación de lógica [Consultar documento](https://github.com/jeffersonmejia/app-distribuidas/blob/Jefferson/docs/tasks/ACC-002.md)."
