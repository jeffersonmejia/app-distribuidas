issue:
  title: '[INT-001] Integrar features y validar compatibilidad'
  body: '<!-- managed-task-id: INT-001 -->


    - **Feature:** Arquitectura

    - **Responsable:** @jeffersonmejia

    - **Rutas:** backend/, frontend/, docs/arquitectura.md, docs/tasks/INT-001.md

    - **Dependencias:** AUTH-002, TEN-001, CRM-001, INV-003, POS-002, ACC-002, PROJ-001, MKT-002, FRONT-001, FRONT-002, FRONT-003, FRONT-004, FRONT-005

    - **Fecha objetivo:** 2026-11-20


    ## Alcance

    Validar la compatibilidad de las features en develop una vez completadas sus dependencias. La integración por PR, los builds, las pruebas, cobertura y CodeQL corresponden a los workflows existentes; esta tarea revisa su resultado y no duplica esas ejecuciones.


    ## Criterios de aceptación

    - [x] El Quality Gate requerido pasó para el estado integrado en develop.

    - [x] Las features respetan límites Feature-First: usan APIs públicas y no crean dependencias internas ni ciclos.

    - [x] Las migraciones aplican desde una base vacía y Hibernate valida el esquema conforme a docs/orm-code-first.md.

    - [ ] Rutas, DTOs, errores y permisos de UI/API son compatibles y respetan el contexto tenant de docs/multitenancy.md.

    - [ ] Las incompatibilidades encontradas tienen corrección asignada al feature responsable; no quedan conflictos de integración pendientes.


    ## Bloqueo actual

    Las dependencias de implementación están completadas. La revisión encontró integraciones UI/API pendientes: Projects y Marketing tienen controladores, pero el frontend solo usa mocks; Inventory, POS y Accounting carecen de controladores HTTP y adaptadores frontend. FRONT-004 (#34) se reabrió y está bloqueada por INT-001; FRONT-005 (#35) se reabrió para conectar Projects/Marketing y resolver Accounting después. El test intermitente está asignado a Dayanara en FRONT-006 (#183). Falta acordar el alcance HTTP antes de asignar las correcciones de contratos por feature. Evidencia: docs/tasks/INT-001.md.


    ## Especificación de lógica

    [Consultar documento](https://github.com/jeffersonmejia/app-distribuidas/blob/Jefferson/docs/tasks/INT-001.md).'
