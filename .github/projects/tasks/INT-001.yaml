    ## Alcance

    Integrar Pull Requests en develop y resolver incompatibilidades entre límites de módulo, contratos, migraciones y frontend.


    ## Criterios de aceptación

    - [ ] Build y checks backend/frontend pasan desde develop.

    - [ ] No se agregan dependencias internas ni ciclos entre features.

    - [ ] Migraciones aplican desde una base limpia y Hibernate valida esquema.

    - [ ] Rutas, DTOs, errores y permisos coinciden en frontend/backend.


