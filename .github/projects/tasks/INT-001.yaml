    Dependencias completadas: AUTH-002, TEN-001, CRM-001, INV-003, PROJ-001, FRONT-001, POS-002. Bloqueada por: @EMLarco (ACC-002, MKT-002), @Dayanarablb (FRONT-002, FRONT-003, FRONT-004, FRONT-005).


