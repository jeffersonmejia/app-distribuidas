  description: Implementar ventas tenant-scoped e idempotentes con snapshot de precios/impuestos aprobado y movimiento de Inventory dentro de una transacción compartida.
  acceptanceCriteria:
  - saleId es UUID del cliente, único por tenant; reintento idéntico devuelve la venta y payload distinto con la misma clave se rechaza.
  - Cada línea incluye productId, unit, quantity, unitPrice y taxAmount; precio e impuesto son snapshots del request en USD con BigDecimal/NUMERIC escala 2.
  - El neto de línea es unitPrice por quantity, redondeado a dos decimales HALF_UP; el impuesto por línea se entrega a Accounting sin calcular tasa.
  - POS persiste la venta dentro del callback de InventoryMovements.issueAndExecute con PostgreSQL y transaction manager compartidos; cualquier fallo revierte ambas escrituras.
  - Se valida actor, membresía, permiso y tenant; POS no consulta tablas, entidades ni repositorios internos de Inventory.
  - Migraciones/pruebas cubren éxito, stock insuficiente, idempotencia, rollback y aislamiento; errores no exponen mensajes internos ni datos cross-tenant.
