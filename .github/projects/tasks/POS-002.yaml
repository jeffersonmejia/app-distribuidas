  description: Implementar ventas tenant-scoped e idempotentes, entregando a Accounting el saleId y el impuesto por línea; compartir transacción con Inventory mediante issueAndExecute.
  acceptanceCriteria:
  - Venta usa UUID saleId del cliente, único por tenant; reintentos idénticos devuelven la venta y payload distinto con la misma clave se rechaza.
  - Cada línea registra productId, unit, quantity, unitPrice y taxAmount; precios e impuestos usan USD BigDecimal/NUMERIC de escala 2.
  - POS persiste la venta dentro del callback de InventoryMovements.issueAndExecute con el mismo PostgreSQL y transaction manager; fallo revierte venta y movimiento.
  - Se valida actor, membresía, permiso y tenant; no se consultan tablas, entidades ni repositorios internos de Inventory.
  - Migraciones y pruebas cubren éxito, stock insuficiente, reintento/idempotencia, rollback y aislamiento tenant.
  - Errores conservan códigos estables de Inventory y no exponen mensajes internos ni datos cross-tenant.
