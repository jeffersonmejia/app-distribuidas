    - **Origen:** Hallazgo de INT-001 en la suite local del 22 de noviembre de 2026.


    ## Alcance

    Estabilizar la prueba de InventoryPage que verifica las métricas KPI y la tabla de productos. En la suite completa, `getByText(''Stock bajo'')` encontró el título KPI y varias insignias de productos; al correr la prueba aislada pasó. El pipeline de develop también pasó, así que el fallo requiere reproducirse y corregirse sin cambiar el comportamiento de negocio.


    ## Criterios de aceptación

    - [ ] La prueba identifica la métrica KPI de forma inequívoca y verifica las insignias por separado.

    - [ ] La prueba pasa aislada y al ejecutar la suite frontend completa.

    - [ ] `npm run test:coverage` termina sin fallos repetidos.


    ## Instructivo

    Consulta `docs/tasks/FRONT-006.md` para el alcance y los criterios de aceptación.'
