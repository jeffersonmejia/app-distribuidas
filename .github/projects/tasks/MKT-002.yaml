issue:
  title: '[MKT-002] Implementar campañas y contactos de Marketing'
  body: "<!-- managed-task-id: MKT-002 -->
**Feature:** Marketing **Responsable:** @EMLarco **Rutas:** backend/src/main/java/com/erp/features/marketing/, backend/src/main/resources/db/migration/, backend/src/test/java/com/erp/features/marketing/ **Dependencias:** TEN-001, MKT-001, CRM-001 **Fecha objetivo:** 2026-11-19
## Alcance Implementar campañas del sistema completo con contactos de CRM, consentimiento administrado por Marketing y envío manual de correo por Gmail SMTP.
## Criterios de aceptación - [ ] Nombre, descripción, fecha de inicio y fecha de fin son obligatorios. - [ ] Estados manuales: Borrador → Programada → Activa → Finalizada; Cancelada desde cualquier estado no terminal. - [ ] Consentimiento y bajas se guardan tenant-scoped en Marketing, vinculados al UUID del cliente CRM; excluir bajas y contactos sin consentimiento. - [ ] Plantillas reutilizables con asunto, cuerpo HTML enriquecido con estilo/iconografía de la app y versión texto. - [ ] Envío manual por Gmail SMTP; fechas no disparan envíos automáticos. - [ ] Límite de pruebas: 20 destinatarios por día; secretos SMTP no se guardan en Git ni aparecen en logs. - [ ] Consumir CRM solo por API pública; validar tenant, permisos, aislamiento y paginación máxima de 5.
## Bloqueo actual Ninguno. Las decisiones de alcance están aprobadas.
## Especificación de lógica [Consultar documento](https://github.com/jeffersonmejia/app-distribuidas/blob/Jefferson/docs/tasks/MKT-002.md)."
