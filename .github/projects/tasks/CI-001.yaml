issue:
  title: '[CI-001] Validar Conventional Commits en Pull Requests'
  body: '<!-- managed-task-id: CI-001 -->


    ## Descripción

    Configurar commitlint con la configuración convencional y validar todos los commits de cada Pull Request dirigido a develop o main.


    ## Criterios de aceptación

    - El workflow valida el rango completo de commits del Pull Request.

    - Solo se aceptan los tipos feat, fix y refactor.

    - Los scopes son opcionales y los mensajes inválidos fallan con errores legibles.


