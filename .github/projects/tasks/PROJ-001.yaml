issue:
  title: '[PROJ-001] Implementar gestión básica de proyectos'
  body: "<!-- managed-task-id: PROJ-001 -->
## Descripción Implementar gestión tenant-scoped de proyectos y tareas con las reglas aprobadas.
## Criterios de aceptación - El nombre del proyecto y el título de cada tarea son obligatorios; demás campos aprobados son opcionales. - Cada tarea pertenece a un solo proyecto; prioridad opcional Alta/Media/Baja. - Estados Pendiente, En progreso, Bloqueada y Completada cumplen las transiciones aprobadas; Completada puede reabrirse como En progreso. - CRUD requiere permiso explícito por tenant y operación; no hay permisos por defecto ni roles implícitos. - Borrado lógico restaurable, sin purga automática; purga permanente manual con permiso explícito. - Persistencia y consultas respetan tenant_id, RLS, restricciones y paginación máxima 5.
## Gestión - Área: Proyectos - Prioridad: Media - Estado: Todo - Responsable: @EMLarco - Rama: Esteban - Rutas: backend/src/main/java/com/erp/features/projects/, backend/src/main/resources/db/migration/, backend/src/test/java/com/erp/features/projects/ - Dependencias: Ninguna
## Especificación de lógica [Consultar documento](https://github.com/jeffersonmejia/app-distribuidas/blob/Jefferson/docs/tasks/PROJ-001.md).
## Bloqueo actual Ninguno. Las decisiones de alcance están aprobadas."
