    number: 44
    title: '[QA-005] Revisar calidad continua con SonarQube local'
    body: "<!-- managed-task-id: QA-005 -->\r\n## Descripción\r\nRevisar preventivamente la calidad del código ya implementado en backend y frontend, incluyendo análisis estático con SonarQube Community local cuando resulte útil. Esta tarea puede avanzar en paralelo aunque QA-003, QA-004 o INT-001 esperen la integración de otras features.\r\n\r\n## Criterios de aceptación\r\n- Leer y aplicar `docs/quality.md` antes del análisis.\r\n- Revisar una versión identificada de `develop` y las features disponibles; registrar commit, alcance y herramientas usadas.\r\n- Reportar hallazgos reproducibles con severidad, ruta/línea, evidencia y recomendación al responsable de la feature mediante el Issue o Pull Request correspondiente.\r\n- Distinguir defectos confirmados de falsos positivos y justificar cualquier descarte.\r\n- SonarQube Community es local y opcional; no se requieren servicios de pago ni se usa como bloqueo de Pull Requests.\r\n- No modificar código de otra feature ni cambiar umbrales\
      \ o criterios de aceptación; dejar que su responsable corrija los hallazgos.\r\n\r\n## Gestión\r\n- Clasificación: Calidad\r\n- Prioridad: Media\r\n- Estado: Pendiente\r\n- Responsable: @Jntorres2001\r\n- Rutas revisadas: `backend/`, `frontend/`, `docs/quality.md`, `docker/compose.sonarqube.yml`\r\n- Dependencias: Ninguna"
    state: OPEN
    url: https://github.com/jeffersonmejia/app-distribuidas/issues/44
