    body: "<!-- managed-task-id: QA-004 -->\n\n**Feature:** Testing  \n**Responsable:** @Jntorres2001  \n**Rutas:** tests/performance/, docs/testing.md  \n**Dependencias:** QA-003, POS-002, INV-003, CRM-001  \n**Fecha objetivo:** 2026-11-24\n\n## Alcance\nEjecutar pruebas k6 de venta POS, disponibilidad de inventario y búsqueda de clientes en entorno de pruebas.\n\n## Criterios de aceptación\n- [ ] Usar ramp-up 1→10 VUs y 10 VUs durante 5 minutos; nunca producción.\n- [ ] Errores HTTP <1%, lecturas p95 <500 ms y escrituras p95 <1 s.\n- [ ] Reportar entorno, datos, duración, error rate y p95 por operación.\n- [ ] Fallas generan corrección asignada al owner antes de liberar.\n\n## Bloqueo actual\nBloqueada por: QA-003 (@Jntorres2001), POS-002 (@BruceRodri), INV-003 (@Sahid-B), CRM-001 (@BruceRodri)."
